<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Learning Pages</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 18px; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .lead { opacity: .7; margin: 0 0 28px; }
    .card {
      display: block;
      padding: 18px;
      border: 1px solid rgba(127,127,127,.35);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
    }
    .card:hover { background: rgba(127,127,127,.08); }
    .title { font-weight: 700; font-size: 18px; margin-bottom: 4px; }
    .meta { opacity: .65; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Learning Pages</h1>
    <p class="lead">スマホから参照する個人用の学習ページ。</p>

    <a class="card" href="./capitalism/">
      <div class="title">資本主義の変化を学ぶ｜6つの問い</div>
      <div class="meta">歴史・成長・変化・課題・AI時代を問いから学ぶ</div>
    </a>
  </main>
</body>
</html>
